[pytest]
# Run from the backend/ directory:
#   py -3.12 -m pytest tests/ -v --tb=short
#
# pythonpath = . ensures the 'app' package is importable
# (adds backend/ to sys.path so 'from app.main import app' works)
testpaths = tests
pythonpath = .

# pytest-asyncio: suppress deprecation warning about fixture loop scope
asyncio_default_fixture_loop_scope = function
